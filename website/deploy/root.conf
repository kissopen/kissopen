map $http_upgrade $kissopen_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=kissopen_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name kissopen.com;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/kissopen-acme;
        try_files $uri =404;
    }
    location / { return 308 https://kissopen.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kissopen.com;
    server_tokens off;
    include /etc/nginx/snippets/kissopen-cloudflare-real-ip.conf;
    ssl_certificate /etc/letsencrypt/live/kissopen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kissopen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KissOpenTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Codes, state and proof in OAuth URLs must never reach access logs.
    access_log off;
    error_log /var/log/nginx/kissopen-error.log crit;
    client_max_body_size 100m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        root /var/www/kissopen-site/current;
        try_files /index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /index.html {
        root /var/www/kissopen-site/current;
        try_files /index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /en/ {
        root /var/www/kissopen-site/current;
        try_files /en/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /en/index.html {
        root /var/www/kissopen-site/current;
        try_files /en/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /zh-cn { return 308 /zh-cn/; }
    location = /zh-cn/ {
        root /var/www/kissopen-site/current;
        try_files /zh-cn/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /zh-cn/index.html {
        root /var/www/kissopen-site/current;
        try_files /zh-cn/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /zh-tw { return 308 /zh-tw/; }
    location = /zh-tw/ {
        root /var/www/kissopen-site/current;
        try_files /zh-tw/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /zh-tw/index.html {
        root /var/www/kissopen-site/current;
        try_files /zh-tw/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /ja { return 308 /ja/; }
    location = /ja/ {
        root /var/www/kissopen-site/current;
        try_files /ja/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /ja/index.html {
        root /var/www/kissopen-site/current;
        try_files /ja/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /ko { return 308 /ko/; }
    location = /ko/ {
        root /var/www/kissopen-site/current;
        try_files /ko/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /ko/index.html {
        root /var/www/kissopen-site/current;
        try_files /ko/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /ru { return 308 /ru/; }
    location = /ru/ {
        root /var/www/kissopen-site/current;
        try_files /ru/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /ru/index.html {
        root /var/www/kissopen-site/current;
        try_files /ru/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /style.css {
        root /var/www/kissopen-site/current;
        try_files /style.css =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /cli.js {
        root /var/www/kissopen-site/current;
        try_files /cli.js =404;
        expires 1h;
        limit_except GET HEAD { deny all; }
    }
    location = /main.js {
        root /var/www/kissopen-site/current;
        try_files /main.js =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /robots.txt {
        root /var/www/kissopen-site/current;
        try_files /robots.txt =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /sitemap.xml {
        root /var/www/kissopen-site/current;
        try_files /sitemap.xml =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /assets/logo.svg {
        root /var/www/kissopen-site/current;
        try_files /assets/logo.svg =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /assets/logo-light.svg {
        root /var/www/kissopen-site/current;
        try_files /assets/logo-light.svg =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /assets/mark.svg {
        root /var/www/kissopen-site/current;
        try_files /assets/mark.svg =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /assets/favicon.ico {
        root /var/www/kissopen-site/current;
        try_files /assets/favicon.ico =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /en { return 308 /en/; }

    # Dedicated download pages; package URLs below retain their own locations.
    location ~ ^/(?:en/|zh-cn/|zh-tw/|ja/|ko/|ru/)?download$ {
        return 308 $uri/;
    }
    location ~ ^/(?:en/|zh-cn/|zh-tw/|ja/|ko/|ru/)?download/(?:index\.html)?$ {
        root /var/www/kissopen-site/current;
        try_files $uri $uri/index.html =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location = /downloads { return 308 /download/; }
    location = /downloads/ { return 308 /download/; }
    location ~ ^/download\.(css|js)$ {
        root /var/www/kissopen-site/current;
        try_files $uri =404;
        expires -1;
        limit_except GET HEAD { deny all; }
    }

    # Website-hosted CLI installer and package definitions.
    location = /install {
        root /var/www/kissopen-site/current;
        try_files /install/install.sh =404;
        default_type text/plain;
        expires -1;
        limit_except GET HEAD { deny all; }
    }
    location ~ ^/install/(install\.sh|PKGBUILD|kissopen\.rb)$ {
        root /var/www/kissopen-site/current;
        try_files $uri =404;
        default_type text/plain;
        expires -1;
        limit_except GET HEAD { deny all; }
    }

    # Public desktop packages and independent platform update manifests.
    location ^~ /downloads/desktop/stable/ {
        alias /srv/kissopen-desktop/stable/;
        autoindex off;
        disable_symlinks on;
        expires -1;
        limit_except GET HEAD { deny all; }
    }

    # Public Android APKs only; private signing material stays off the server.
    location ^~ /downloads/android/stable/ {
        alias /srv/kissopen-android/stable/;
        autoindex off;
        disable_symlinks on;
        expires -1;
        limit_except GET HEAD { deny all; }
    }

    # Account/profile/billing APIs are independent of encrypted relay/OAuth.
    # Public catalog assets only; no account data or cloud execution workspace.
    location ^~ /downloads/plugins/ {
        alias /srv/kissopen-plugin-catalog/20261006/;
        autoindex off;
        disable_symlinks on;
        limit_except GET HEAD { deny all; }
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
    location ^~ /metrics { return 404; }
    location = /v1/community/auth/start {
        limit_req zone=kissopen_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Replace, never append an untrusted incoming X-Forwarded-For header.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kissopen_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
