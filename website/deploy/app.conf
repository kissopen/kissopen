server {
    listen 80;
    listen [::]:80;
    server_name app.kissopen.com;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/kissopen-acme;
        try_files $uri =404;
    }
    location / { return 308 https://app.kissopen.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.kissopen.com;
    server_tokens off;
    include /etc/nginx/snippets/kissopen-cloudflare-real-ip.conf;
    ssl_certificate /etc/letsencrypt/live/app.kissopen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.kissopen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KissOpenAppTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Codes, state and proof in OAuth URLs must never reach access logs.
    access_log off;
    error_log /var/log/nginx/kissopen-error.log crit;
    client_max_body_size 100m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Account/profile/billing APIs are independent of encrypted relay/OAuth.
    # Public catalog assets only; no account data or cloud execution workspace.
    location ^~ /downloads/plugins/ {
        alias /srv/kissopen-plugin-catalog/20261006/;
        autoindex off;
        disable_symlinks on;
        limit_except GET HEAD { deny all; }
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
    location ^~ /metrics { return 404; }
    location = /v1/community/auth/start {
        limit_req zone=kissopen_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Replace, never append an untrusted incoming X-Forwarded-For header.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kissopen_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
