# Temporary ACME bootstrap. Replaced by app.conf after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name app.kissopen.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/kissopen-acme;
        try_files $uri =404;
    }
    location / { return 308 https://app.kissopen.com$request_uri; }
}
