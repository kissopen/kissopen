name: CLI Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/kissopen-cli/**'
      - 'packages/kissopen-server/**'
      - 'packages/kissopen-server-self-host/**'
      - 'packages/kissopen-wire/**'
      - '.github/workflows/cli-smoke-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/kissopen-cli/**'
      - 'packages/kissopen-server/**'
      - 'packages/kissopen-server-self-host/**'
      - 'packages/kissopen-wire/**'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke-test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: |
        pnpm --filter @kissopen/kissopen-wire --fail-if-no-match build
        pnpm --filter kissopen --fail-if-no-match build

    # kissopen-server-self-host ships only a bundled runtime (no sources), and the
    # bundler is bun.
    - name: Install Bun
      uses: oven-sh/setup-bun@v2

    # `kissopen server` resolves the self-host runtime and bundled webapp from
    # kissopen-server-self-host. Its build bundles packages/kissopen-server's
    # standalone entrypoint and copies prisma/ in, so it must run before pack.
    - name: Build kissopen-server-self-host runtime + bundle webapp
      run: |
        pnpm --filter kissopen-server-self-host --fail-if-no-match build
        pnpm --filter kissopen-server-self-host --fail-if-no-match run bundle:webapp

    - name: Pack packages
      run: |
        pnpm --filter @kissopen/kissopen-wire --fail-if-no-match pack --pack-destination packages/kissopen-wire
        pnpm --filter kissopen --fail-if-no-match pack --pack-destination packages/kissopen-cli
        pnpm --filter kissopen-server-self-host --fail-if-no-match pack --pack-destination packages/kissopen-server-self-host

    - name: Install packed packages globally
      run: |
        WIRE_PACKAGE_FILE=$(ls packages/kissopen-wire/*.tgz)
        KISSOPEN_PACKAGE_FILE=$(ls packages/kissopen-cli/*.tgz)
        SERVER_PACKAGE_FILE=$(ls packages/kissopen-server-self-host/*.tgz)
        npm install -g "./$WIRE_PACKAGE_FILE" "./$SERVER_PACKAGE_FILE" "./$KISSOPEN_PACKAGE_FILE"

    - name: Test binary execution
      run: |
        # Test that the binary starts successfully
        echo "Testing kissopen --help..."
        timeout 30s kissopen --help || {
          echo "Error: kissopen --help failed or timed out"
          exit 1
        }

        echo "Testing kissopen --version..."
        timeout 10s kissopen --version || {
          echo "Error: kissopen --version failed or timed out"
          exit 1
        }

        echo "Testing kissopen doctor..."
        timeout 30s kissopen doctor || {
          echo "Error: kissopen doctor failed or timed out"
          exit 1
        }

        echo "Testing kissopen daemon status..."
        timeout 10s kissopen daemon status || {
          echo "Error: kissopen daemon status failed or timed out"
          exit 1
        }

        echo "Binary smoke test passed on Linux!"

    - name: Test packaged server (kissopen server)
      run: |
        export KISSOPEN_HOME_DIR="$(mktemp -d)"
        timeout 90s kissopen server --port 4505 --host 127.0.0.1 --no-persist --reset > /tmp/kissopen-server.log 2>&1 &
        SERVER_PID=$!
        UP=0
        for i in $(seq 1 60); do
          if curl -sf -m 2 http://127.0.0.1:4505/ -o /dev/null; then UP=1; echo "server up after ${i}s"; break; fi
          sleep 1
        done
        # Exercise the Prisma native query engine via a DB-backed read.
        PK=$(node -e "console.log(Buffer.alloc(32).toString('base64'))")
        BODY=$(curl -s -m 5 -G http://127.0.0.1:4505/v1/auth/request/status --data-urlencode "publicKey=$PK" || true)
        echo "auth/request/status -> $BODY"
        kill "$SERVER_PID" 2>/dev/null || true
        pkill -f kissopen-server || true
        echo "=== kissopen server log ==="; cat /tmp/kissopen-server.log || true
        if [ "$UP" != "1" ]; then echo "Error: kissopen server did not become healthy"; exit 1; fi
        if ! echo "$BODY" | grep -q '"status"'; then echo "Error: Prisma-backed endpoint did not respond"; exit 1; fi
        if grep -qiE 'PrismaClientInitializationError|could not locate.*Query Engine' /tmp/kissopen-server.log; then echo "Error: Prisma query engine failed to load"; exit 1; fi
        echo "kissopen server smoke test passed (booted + Prisma query engine OK)"

  smoke-test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: |
        pnpm --filter @kissopen/kissopen-wire --fail-if-no-match build
        pnpm --filter kissopen --fail-if-no-match build

    - name: Pack packages
      run: |
        pnpm --filter @kissopen/kissopen-wire --fail-if-no-match pack --pack-destination packages/kissopen-wire
        pnpm --filter kissopen --fail-if-no-match pack --pack-destination packages/kissopen-cli

    - name: Install packed package globally
      shell: cmd
      run: |
        for %%w in (packages\kissopen-wire\*.tgz) do for %%f in (packages\kissopen-cli\*.tgz) do npm install -g "%%w" "%%f"

    - name: Debug npm global installation structure
      shell: cmd
      run: |
        for /f "tokens=*" %%i in ('npm config get prefix') do set NPM_PREFIX=%%i
        echo NPM_PREFIX: %NPM_PREFIX%
        echo Listing npm prefix directory:
        dir "%NPM_PREFIX%" 2>nul || echo Failed to list NPM_PREFIX
        echo.
        echo Checking for node_modules in npm prefix:
        if exist "%NPM_PREFIX%\node_modules" (
          echo Found node_modules directory
          dir "%NPM_PREFIX%\node_modules" 2>nul
          echo.
          echo Checking for kissopen package:
          if exist "%NPM_PREFIX%\node_modules\kissopen" (
            echo Found kissopen package
            dir "%NPM_PREFIX%\node_modules\kissopen" 2>nul
            echo.
            echo Checking for dist directory:
            if exist "%NPM_PREFIX%\node_modules\kissopen\dist" (
              echo Found dist directory
              dir "%NPM_PREFIX%\node_modules\kissopen\dist" 2>nul
            ) else (
              echo No dist directory found
            )
          ) else (
            echo No kissopen package found
          )
        ) else (
          echo No node_modules directory found
        )

    - name: Test binary execution
      shell: cmd
      run: |
        @echo on

        rem Get npm global prefix and add to PATH
        for /f "tokens=*" %%i in ('npm config get prefix') do set NPM_PREFIX=%%i
        set PATH=%NPM_PREFIX%;%PATH%
        echo NPM_PREFIX: %NPM_PREFIX%
        echo Current PATH: %PATH%

        rem Debug: Check if kissopen exists in various locations
        echo Checking for kissopen binary...
        where kissopen 2>nul && echo Found kissopen in PATH || echo kissopen not found in PATH
        if exist "%NPM_PREFIX%\kissopen.cmd" echo Found kissopen.cmd in NPM_PREFIX
        if exist "%NPM_PREFIX%\node_modules\.bin\kissopen.cmd" echo Found kissopen.cmd in .bin directory
        dir "%NPM_PREFIX%\*kissopen*" 2>nul || echo No kissopen files found in NPM_PREFIX

        rem Debug: Check the actual contents and encoding of the installed file
        if exist "%NPM_PREFIX%\kissopen.cmd" (
          echo File size and type:
          dir "%NPM_PREFIX%\kissopen.cmd"
          echo.
          echo First few lines of the file:
          type "%NPM_PREFIX%\kissopen.cmd" | head -5
          echo.
          echo Hex dump of first 50 bytes to check line endings:
          powershell -Command "Get-Content '%NPM_PREFIX%\kissopen.cmd' -Encoding Byte -TotalCount 50 | ForEach-Object { '{0:X2}' -f $_ } | Join-String -Separator ' '"
          echo.
          echo Testing with direct path...
          "%NPM_PREFIX%\kissopen.cmd" --help
        ) else (
          echo Testing kissopen --help...
          kissopen --help
        )
        if errorlevel 1 (
          echo Error: kissopen --help failed
          exit /b 1
        )

        rem Test version
        if exist "%NPM_PREFIX%\kissopen.cmd" (
          "%NPM_PREFIX%\kissopen.cmd" --version
        ) else (
          kissopen --version
        )
        if errorlevel 1 (
          echo Error: kissopen --version failed
          exit /b 1
        )

        rem Test doctor
        echo Testing kissopen doctor...
        if exist "%NPM_PREFIX%\kissopen.cmd" (
          "%NPM_PREFIX%\kissopen.cmd" doctor
        ) else (
          kissopen doctor
        )
        if errorlevel 1 (
          echo Error: kissopen doctor failed
          exit /b 1
        )

        rem Test daemon status
        echo Testing kissopen daemon status...
        if exist "%NPM_PREFIX%\kissopen.cmd" (
          "%NPM_PREFIX%\kissopen.cmd" daemon status
        ) else (
          kissopen daemon status
        )
        if errorlevel 1 (
          echo Error: kissopen daemon status failed
          exit /b 1
        )

        echo Smoke test passed on Windows!

# We don't need a smoke test for macOS because most contributors are developing on macOS.
